[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esg-workshop"
version = "1.0.0"
description = "Python examples for sustainable finance and climate risk courses"
authors = [{ name = "Liber Jaime Merlos", email = "libjai@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "statsmodels", "matplotlib", "requests", "lxml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
